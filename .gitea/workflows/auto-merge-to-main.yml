name: Auto-merge claude/* to main

on:
  push:
    branches:
      - 'claude/**'

jobs:
  merge-to-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITEA_TOKEN }}

      - name: Merge to main
        run: |
          git config user.name "Gitea Actions"
          git config user.email "actions@gitea"
          git checkout main
          git merge --ff-only ${{ github.ref_name }} || git merge --no-ff ${{ github.ref_name }} -m "Auto-merge ${{ github.ref_name }} into main"
          git push origin main
