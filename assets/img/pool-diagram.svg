<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-label="Pool equipment pad diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#c9e8f8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background pad area -->
  <rect width="600" height="420" fill="url(#bg)" rx="12"/>
  <rect x="20" y="20" width="560" height="380" fill="#daedf8" rx="8" stroke="#b8d9ef" stroke-width="1"/>

  <!-- Concrete pad -->
  <rect x="50" y="80" width="500" height="260" fill="#e8e0d8" rx="6" stroke="#ccc" stroke-width="1"/>
  <text x="300" y="68" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="11" fill="#9AA5B4" font-weight="600" letter-spacing="1">EQUIPMENT PAD</text>

  <!-- PUMP -->
  <g id="comp-pump" filter="url(#shadow)">
    <ellipse cx="130" cy="200" rx="36" ry="28" fill="#4a90c4" stroke="#2D6EA6" stroke-width="2"/>
    <ellipse cx="130" cy="200" rx="22" ry="16" fill="#5ba3d6" stroke="#2D6EA6" stroke-width="1.5"/>
    <text x="130" y="204" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="9" fill="white" font-weight="700">PUMP</text>
    <!-- Inlet/outlet pipes -->
    <rect x="94" y="196" width="24" height="8" fill="#3a7bb0" rx="2"/>
    <rect x="166" y="196" width="24" height="8" fill="#3a7bb0" rx="2"/>
  </g>

  <!-- STRAINER BASKET -->
  <g id="comp-strainer" filter="url(#shadow)">
    <rect x="100" y="235" width="60" height="44" fill="#6aabbf" stroke="#3d8fa8" stroke-width="2" rx="6"/>
    <rect x="108" y="243" width="44" height="28" fill="#7bc5d9" stroke="#3d8fa8" stroke-width="1" rx="3"/>
    <!-- basket lines -->
    <line x1="118" y1="243" x2="118" y2="271" stroke="#3d8fa8" stroke-width="0.8" opacity="0.6"/>
    <line x1="130" y1="243" x2="130" y2="271" stroke="#3d8fa8" stroke-width="0.8" opacity="0.6"/>
    <line x1="142" y1="243" x2="142" y2="271" stroke="#3d8fa8" stroke-width="0.8" opacity="0.6"/>
    <text x="130" y="290" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="8" fill="#4a5068">STRAINER</text>
  </g>

  <!-- FILTER -->
  <g id="comp-filter" filter="url(#shadow)">
    <ellipse cx="270" cy="185" rx="42" ry="52" fill="#5a8fc4" stroke="#2D6EA6" stroke-width="2"/>
    <ellipse cx="270" cy="170" rx="30" ry="38" fill="#6ea6d8" stroke="#2D6EA6" stroke-width="1"/>
    <rect x="256" y="237" width="28" height="12" fill="#3a7bb0" rx="3"/>
    <text x="270" y="175" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="10" fill="white" font-weight="700">FILTER</text>
    <!-- multiport valve -->
    <rect x="250" y="249" width="40" height="22" fill="#2D6EA6" rx="4" stroke="#1f5288" stroke-width="1.5"/>
    <text x="270" y="264" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="7" fill="white" font-weight="600">BACKWASH</text>
    <text x="270" y="273" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="7" fill="white" font-weight="600">VALVE</text>
  </g>

  <!-- PRESSURE GAUGE -->
  <g id="comp-gauge" filter="url(#shadow)">
    <circle cx="350" cy="140" r="20" fill="white" stroke="#ccc" stroke-width="2"/>
    <circle cx="350" cy="140" r="14" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
    <!-- gauge needle at ~15 psi (normal) -->
    <line x1="350" y1="140" x2="357" y2="128" stroke="#D62839" stroke-width="2" stroke-linecap="round"/>
    <circle cx="350" cy="140" r="2" fill="#555"/>
    <!-- tick marks -->
    <line x1="350" y1="127" x2="350" y2="131" stroke="#555" stroke-width="1.5"/>
    <line x1="336" y1="140" x2="340" y2="140" stroke="#555" stroke-width="1.5"/>
    <line x1="364" y1="140" x2="360" y2="140" stroke="#555" stroke-width="1.5"/>
    <text x="350" y="108" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="8" fill="#4a5068">PRESSURE</text>
    <text x="350" y="118" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="8" fill="#4a5068">GAUGE</text>
    <rect x="347" y="160" width="6" height="12" fill="#aaa"/>
  </g>

  <!-- HEATER -->
  <g id="comp-heater" filter="url(#shadow)">
    <rect x="390" y="155" width="80" height="60" fill="#c47a2a" stroke="#a06020" stroke-width="2" rx="8"/>
    <rect x="398" y="163" width="64" height="20" fill="#d48a3a" rx="4"/>
    <!-- flame icon -->
    <path d="M428 188 Q432 178 436 188 Q438 180 444 188 Q442 175 436 170 Q432 178 428 188Z" fill="#ff6b00" opacity="0.8"/>
    <text x="430" y="207" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="9" fill="white" font-weight="700">HEATER</text>
    <!-- pipes -->
    <rect x="378" y="178" width="12" height="8" fill="#a06020" rx="2"/>
    <rect x="470" y="178" width="12" height="8" fill="#a06020" rx="2"/>
  </g>

  <!-- TIMECLOCK -->
  <g id="comp-timeclock" filter="url(#shadow)">
    <rect x="468" y="100" width="54" height="54" fill="#7b6ea8" stroke="#5c518a" stroke-width="2" rx="6"/>
    <circle cx="495" cy="120" r="16" fill="#9988c4" stroke="#5c518a" stroke-width="1"/>
    <line x1="495" y1="108" x2="495" y2="120" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="495" y1="120" x2="503" y2="126" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <text x="495" y="145" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="8" fill="white" font-weight="700">TIMECLOCK</text>
  </g>

  <!-- SHUT-OFF VALVES -->
  <g id="comp-valves" filter="url(#shadow)">
    <!-- valve 1 -->
    <rect x="172" y="194" width="16" height="12" fill="#888" stroke="#555" stroke-width="1.5" rx="2"/>
    <circle cx="180" cy="200" r="5" fill="#aaa" stroke="#555" stroke-width="1"/>
    <!-- valve 2 -->
    <rect x="220" y="194" width="16" height="12" fill="#888" stroke="#555" stroke-width="1.5" rx="2"/>
    <circle cx="228" cy="200" r="5" fill="#aaa" stroke="#555" stroke-width="1"/>
    <text x="200" y="222" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="8" fill="#4a5068">SHUT-OFF VALVES</text>
  </g>

  <!-- Pipe connections (behind components) -->
  <!-- pump to filter -->
  <line x1="190" y1="200" x2="228" y2="200" stroke="#3a7bb0" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <!-- filter to heater -->
  <line x1="312" y1="200" x2="390" y2="185" stroke="#3a7bb0" stroke-width="6" stroke-linecap="round" opacity="0.4"/>

  <!-- Labels -->
  <text x="300" y="395" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="10" fill="#9AA5B4">Click a component to learn about it</text>
</svg>
